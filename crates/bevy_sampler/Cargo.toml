[package]
name = "bevy_sampler"
version = "0.20.0-dev"
edition = "2024"
description = "Stream LLM samples into Bevy ECS components"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "llm", "agent"]
publish = false

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_model = { path = "../bevy_model", version = "0.20.0-dev" }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0-dev", features = [
  "multi_threaded",
] }
bevy_tool = { path = "../bevy_tool", version = "0.20.0-dev" }

# other
async-channel = "2.3.0"
# Runs reqwest's tokio-based futures on Bevy's task pools.
async-compat = "0.2"
async-io = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "http2",
  "rustls-tls",
] }
serde_json = "1"
thiserror = "2"
zstd = "0.13"

[lints]
workspace = true
