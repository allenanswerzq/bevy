[package]
name = "bevy_tool"
version = "0.20.0-dev"
edition = "2024"
description = "Tools an LLM can call, defined and run as Bevy systems"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "llm", "agent"]
publish = false

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev" }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0-dev" }

# other
async-io = "2"
async-process = "2"
blocking = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0-dev", features = [
  "multi_threaded",
] }

[lints]
workspace = true
